<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>{{ title }} | {{ contact_full_name }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ contact_full_name }}" href="{{ base_url }}/feed.xml">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ site_origin }}{{ base_url }}/img/profile.jpg">
<link rel="icon" href="{{ base_url }}/img/favicons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="{{ base_url }}/img/favicons/favicon-180.png">
{{> style }}
</head>
